[package]
name = "sonar-desktop"
version = "0.3.6"
edition = "2021"
publish = false

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"

# Software rendering decides how smooth scrolling feels: these crates run for
# every frame, so they are optimized for speed and the rest for size.
[profile.release.package.tiny-skia]
opt-level = 3
[profile.release.package.tiny-skia-path]
opt-level = 3
[profile.release.package.iced_tiny_skia]
opt-level = 3
[profile.release.package.iced_graphics]
opt-level = 3
[profile.release.package.iced_core]
opt-level = 3
[profile.release.package.iced_widget]
opt-level = 3
[profile.release.package.iced_runtime]
opt-level = 3
[profile.release.package.iced_renderer]
opt-level = 3
[profile.release.package.cosmic-text]
opt-level = 3
[profile.release.package.swash]
opt-level = 3
[profile.release.package.softbuffer]
opt-level = 3
[profile.release.package.resvg]
opt-level = 3
[profile.release.package.usvg]
opt-level = 3

# The noise suppressor runs for every 10 ms of microphone audio.
[profile.release.package.deep-filter-rt]
opt-level = 3
[profile.release.package.tract-core]
opt-level = 3
[profile.release.package.tract-linalg]
opt-level = 3
[profile.release.package.tract-data]
opt-level = 3
[profile.release.package.tract-onnx]
opt-level = 3
[profile.release.package.tract-pulse]
opt-level = 3
[profile.release.package.ndarray]
opt-level = 3
[profile.release.package.realfft]
opt-level = 3
[profile.release.package.rustfft]
opt-level = 3

# Keep debug builds usable: the renderer is unbearably slow unoptimized.
[profile.dev.package.deep-filter-rt]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.iced_tiny_skia]
opt-level = 3
[profile.dev.package.cosmic-text]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.softbuffer]
opt-level = 3

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "tokio", "svg", "web-colors", "advanced", "image-without-codecs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
url = "2"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio = { version = "1", features = ["rt", "time", "sync"] }
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
cpal = "0.16"
opus = "0.4"
rust_socketio = { version = "0.6", features = ["async"] }
zeroize = "1"
sha2 = "0.10"
hmac = "0.12"
png = "0.17"
webrtc = "0.21.1"
rtc = { version = "0.21.1", default-features = false }
async-trait = "0.1"
bytes = "1"
matrix-sdk-crypto = "0.19.1"
matrix-sdk-common = "0.19.1"
matrix-sdk-sqlite = { version = "0.19.1", default-features = false, features = ["crypto-store", "bundled"] }
ruma = { version = "0.17", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Networking_WindowsWebServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }
windows-core = "0.58"
windows = { version = "0.58", features = ["implement", "Win32_UI_Shell", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Media_Audio", "Win32_Security", "Win32_System_Threading", "Foundation", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D10", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture"] }
deep-filter-rt = "0.2.0"
ndarray = "0.17"
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
vodozemac = "0.11.1"
ogg = "0.9"
